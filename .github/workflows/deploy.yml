name: deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  AWS_REGION: ap-southeast-1
  PYTHON_VERSION: "3.12"
  TERRAFORM_VERSION: "1.9.8"

jobs:
  # ── CI: always runs on PR + push ─────────────────────────────────────────
  lint_and_test:
    name: Lint + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dev deps
        run: pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check shared services scripts tests

      - name: Pytest
        run: pytest -v

  # ── Build Lambda artifacts ───────────────────────────────────────────────
  package:
    name: Build Lambda zips
    runs-on: ubuntu-latest
    needs: lint_and_test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Build all service zips
        run: |
          set -euo pipefail
          mkdir -p dist
          for svc in webhook scheduler exporter; do
            echo "── Building $svc ─────────────────────────────"
            mkdir -p services/$svc/build
            pip install -r services/$svc/requirements.txt -t services/$svc/build --quiet
            cp -r shared services/$svc/build/
            cp services/$svc/handler.py services/$svc/build/
            (cd services/$svc/build && zip -qr ../../../dist/$svc.zip .)
            echo "  Built dist/$svc.zip ($(du -h dist/$svc.zip | cut -f1))"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lambda-zips
          path: dist/*.zip
          retention-days: 7

  # ── Terraform plan (PR) / apply (main push) ──────────────────────────────
  terraform:
    name: Terraform ${{ github.event_name == 'pull_request' && 'plan' || 'apply' }}
    runs-on: ubuntu-latest
    needs: package
    environment:
      name: ${{ github.event_name == 'pull_request' && 'prod-plan' || 'prod' }}
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4

      - name: Download Lambda zips
        uses: actions/download-artifact@v4
        with:
          name: lambda-zips
          path: dist

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - run: terraform init -input=false

      - name: Terraform fmt check
        run: terraform fmt -check -recursive

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        if: github.event_name == 'pull_request'
        run: terraform plan -input=false -no-color

      - name: Terraform apply
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: terraform apply -input=false -auto-approve

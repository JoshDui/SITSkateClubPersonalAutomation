[project]
name = "skatetelegrambot-aws"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["infra/terraform", "dist", "services/*/build"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # simplify
]
ignore = [
    "E501", # line too long — handled by formatter
    "B008", # function call in default arg (boto3 clients at module scope)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B017", "SIM117"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
